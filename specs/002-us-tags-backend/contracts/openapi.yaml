openapi: 3.1.0
info:
  title: QuickFlow API - task tags
  version: 0.2.0
  description: >-
    Endpoints of feature 002-us-tags (US1, US-TAGS-1). It extends the QuickFlow API of
    specs/001-quickflow-backend/contracts/openapi.yaml: every other endpoint stays as it is there,
    and every endpoint that returns a Task (including the dashboard) now also returns its `tags`.
    Errors are RFC 9457 problem details. Parts marked "Qn" follow the recommended answer to open
    question n of spec.md and may change with the reviewer's answer.
servers:
  - url: http://localhost:8080
tags:
  - name: tasks

paths:
  /api/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks (search, filters incl. tag, sort; archived excluded by default, BR-4)
      parameters:
        - { name: q, in: query, required: false, description: Case-insensitive substring of the title, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: priority, in: query, required: false, schema: { $ref: '#/components/schemas/TaskPriority' } }
        - { name: dueFrom, in: query, required: false, description: Inclusive, schema: { type: string, format: date } }
        - { name: dueTo, in: query, required: false, description: Inclusive, schema: { type: string, format: date } }
        - { name: archived, in: query, required: false, schema: { type: boolean, default: false } }
        - name: tag
          in: query
          required: false
          description: >-
            Only tasks that have this tag (whole tag, ignoring case, spaces around it ignored);
            blank = no tag filter (FR-004); a value no task has gives an empty list
          schema: { type: string }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [createdAt, dueDate], default: createdAt } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Matching tasks, in the requested order (null due dates last); empty when no task has the tag
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Task' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task, with its tags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: addTaskTags
      summary: >-
        Add tags (FR-001). Trimmed, case-insensitive (BR-T2); a tag already on the task is kept once (Q2).
        All or nothing: an invalid tag or more than 10 tags in total rejects the whole request and
        leaves the tags unchanged (BR-T1, BR-T3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskTags' }
      responses:
        '200':
          description: The task with its tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: removeTaskTag
      summary: >-
        Remove one tag, matched ignoring case (FR-005). A tag the task doesn't have is a no-op (Q3).
      parameters:
        - { name: tag, in: query, required: true, description: The tag to remove, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: The task with its remaining tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Validation failed (field `tags` or `tag`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such task (or it was deleted)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [tags] }
        message: { type: string }

    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
    TaskPriority: { type: string, enum: [LOW, MEDIUM, HIGH] }
    TaskTags:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          minItems: 1
          description: >-
            Each tag is trimmed first, then must be 1-30 characters (BR-T1); checked by the server,
            error field `tags`
          items: { type: string }
          examples: [[work, urgent]]
    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt, archived, overdue, tags]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        archived: { type: boolean }
        overdue: { type: boolean, description: Computed on read (FR-01.7) }
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Lower case (Q1), alphabetical; empty when the task has no tags
          items: { type: string, minLength: 1, maxLength: 30 }
