openapi: 3.1.0
info:
  title: QuickFlow API
  version: 0.1.0
  description: >-
    Single-user productivity API (tasks, habits, learning cards, Todo Plans, dashboard, settings).
    Date-times are ISO-8601 with offset, rendered in the app time zone (GET /api/app-info).
    Dates are ISO calendar dates in the app time zone. Errors are RFC 9457 problem details.
    Parts marked "Qn" follow the reviewer's answer to that question (spec.md Clarifications, 2026-09-24).
servers:
  - url: http://localhost:8080
tags:
  - name: tasks
  - name: habits
  - name: learning
  - name: plans
  - name: dashboard
  - name: settings
  - name: info

paths:
  /api/app-info:
    get:
      tags: [info]
      operationId: getAppInfo
      summary: App time zone and the server's current time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInfo' }

  # ---------------------------------------------------------------- tasks (US1)
  /api/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks (search, filters, sort; archived excluded by default, BR-4)
      parameters:
        - { name: q, in: query, required: false, description: Case-insensitive substring of the title, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: priority, in: query, required: false, schema: { $ref: '#/components/schemas/TaskPriority' } }
        - { name: dueFrom, in: query, required: false, description: Inclusive, schema: { type: string, format: date } }
        - { name: dueTo, in: query, required: false, description: Inclusive, schema: { type: string, format: date } }
        - { name: archived, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [createdAt, dueDate], default: createdAt } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Matching tasks, in the requested order (null due dates last)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Task' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/tasks/overdue:
    get:
      tags: [tasks]
      operationId: listOverdueTasks
      summary: Tasks due before today, not Done, not archived (FR-01.7)
      responses:
        '200':
          description: Overdue tasks, oldest due date first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Task' } }
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [tasks]
      operationId: updateTask
      summary: Replace the editable fields (status DONE sets completedAt, leaving DONE clears it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete permanently (BR-14)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/tasks/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Mark completed (status DONE, BR-5)
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/tasks/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: archiveTask
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/tasks/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: restoreTask
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- habits (US2)
  /api/habits:
    get:
      tags: [habits]
      operationId: listHabits
      parameters:
        - { name: active, in: query, required: false, description: Omit for all habits, schema: { type: boolean } }
      responses:
        '200':
          description: Habits with progress, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Habit' } }
    post:
      tags: [habits]
      operationId: createHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HabitWrite' }
      responses:
        '201':
          description: Created (active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Habit' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/habits/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [habits]
      operationId: getHabit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Habit' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [habits]
      operationId: updateHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HabitWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Habit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [habits]
      operationId: deleteHabit
      summary: Delete the habit and its completions permanently (BR-14)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/habits/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [habits]
      operationId: deactivateHabit
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Habit' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/habits/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [habits]
      operationId: activateHabit
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Habit' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/habits/{id}/completions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [habits]
      operationId: listHabitCompletions
      responses:
        '200':
          description: Completions, newest date first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HabitCompletion' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [habits]
      operationId: completeHabit
      summary: Record a completion for a date (default today); one per habit and date (BR-7)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HabitCompletionCreate' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HabitCompletion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/habits/{id}/completions/{date}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    delete:
      tags: [habits]
      operationId: undoHabitCompletion
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- learning (US3)
  /api/learning-cards:
    get:
      tags: [learning]
      operationId: listLearningCards
      responses:
        '200':
          description: Cards with their milestones and notes, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LearningCard' } }
    post:
      tags: [learning]
      operationId: createLearningCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningCardCreate' }
      responses:
        '201':
          description: Created (NOT_STARTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/learning-cards/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [learning]
      operationId: getLearningCard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningCard' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [learning]
      operationId: updateLearningCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningCardUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [learning]
      operationId: deleteLearningCard
      summary: Delete the card, its milestones and notes permanently (BR-14)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/learning-cards/{id}/milestones:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [learning]
      operationId: addMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneCreate' }
      responses:
        '201':
          description: Added (not done)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/learning-cards/{id}/milestones/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: milestoneId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [learning]
      operationId: updateMilestone
      summary: Edit title/target date and set done or not done
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [learning]
      operationId: deleteMilestone
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/learning-cards/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [learning]
      operationId: addNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/learning-cards/{id}/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: noteId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [learning]
      operationId: deleteNote
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- plans (US4)
  /api/plans:
    get:
      tags: [plans]
      operationId: listPlans
      parameters:
        - name: group
          in: query
          required: false
          description: active = NOT_STARTED or IN_PROGRESS (priorityOrder asc, then start asc); completed = COMPLETED (end desc); all = active then completed
          schema: { type: string, enum: [active, completed, all], default: all }
      responses:
        '200':
          description: Plans with computed status, progress and rest time
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Plan' } }
    post:
      tags: [plans]
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [plans]
      operationId: getPlan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [plans]
      operationId: updatePlan
      summary: Edit title, estimated duration, start/end and priority order (items are unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [plans]
      operationId: deletePlan
      summary: Delete the plan and its items; referenced sources are unchanged (BR-14)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/plans/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [plans]
      operationId: setPlanItemDone
      summary: Mark a plan item done or not done; a TASK item marked done also completes the task; un-ticking and HABIT/LEARNING_RESOURCE items change no source (BR-13, Q1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanItemUpdate' }
      responses:
        '200':
          description: The whole plan with its new progress and status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- dashboard (US5)
  /api/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      responses:
        '200':
          description: Summary computed from current data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  # ---------------------------------------------------------------- settings (US6, Q3)
  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        '200':
          description: Current settings (defaults on first read)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    put:
      tags: [settings]
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource (or it was deleted)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with current state (duplicate habit completion, inactive habit)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [title] }
        message: { type: string }

    AppInfo:
      type: object
      required: [timeZone, now]
      properties:
        timeZone: { type: string, examples: [Africa/Cairo] }
        now: { type: string, format: date-time }

    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
    TaskPriority: { type: string, enum: [LOW, MEDIUM, HIGH] }
    TaskCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/TaskStatus', description: Default TODO }
        priority: { $ref: '#/components/schemas/TaskPriority', description: Default MEDIUM }
        dueDate: { type: [string, 'null'], format: date }
    TaskUpdate:
      type: object
      required: [title, status, priority]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date }
    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt, archived, overdue]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        archived: { type: boolean }
        overdue: { type: boolean, description: Computed on read (FR-01.7) }

    HabitFrequency: { type: string, enum: [DAILY, WEEKLY] }
    HabitWrite:
      type: object
      required: [name, frequency]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 2000 }
        frequency: { $ref: '#/components/schemas/HabitFrequency' }
    Habit:
      type: object
      required: [id, name, frequency, createdAt, active, completedToday, doneForCurrentPeriod, currentStreak]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        frequency: { $ref: '#/components/schemas/HabitFrequency' }
        createdAt: { type: string, format: date-time }
        active: { type: boolean }
        completedToday: { type: boolean }
        doneForCurrentPeriod: { type: boolean, description: Today (DAILY) or current Monday-Sunday week (WEEKLY) }
        currentStreak: { type: integer, minimum: 0, description: Consecutive periods with a completion }
    HabitCompletionCreate:
      type: object
      properties:
        date: { type: [string, 'null'], format: date, description: Default today; a future date is rejected }
    HabitCompletion:
      type: object
      required: [id, habitId, completionDate, createdAt]
      properties:
        id: { type: integer, format: int64 }
        habitId: { type: integer, format: int64 }
        completionDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    LearningStatus: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED] }
    LearningCardCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
    LearningCardUpdate:
      type: object
      required: [title, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/LearningStatus' }
    LearningCard:
      type: object
      required: [id, title, status, createdAt, milestones, notes, milestonesDone, milestonesTotal]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/LearningStatus' }
        createdAt: { type: string, format: date-time }
        milestones: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        notes: { type: array, items: { $ref: '#/components/schemas/Note' } }
        milestonesDone: { type: integer }
        milestonesTotal: { type: integer }
    MilestoneCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        targetDate: { type: [string, 'null'], format: date }
    MilestoneUpdate:
      type: object
      required: [title, done]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        targetDate: { type: [string, 'null'], format: date }
        done: { type: boolean }
    Milestone:
      type: object
      required: [id, cardId, title, done]
      properties:
        id: { type: integer, format: int64 }
        cardId: { type: integer, format: int64 }
        title: { type: string }
        done: { type: boolean }
        targetDate: { type: [string, 'null'], format: date }
    NoteCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
    Note:
      type: object
      required: [id, cardId, text, createdAt]
      properties:
        id: { type: integer, format: int64 }
        cardId: { type: integer, format: int64 }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    PlanStatus: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED] }
    PlanSourceType: { type: string, enum: [TASK, HABIT, LEARNING_RESOURCE] }
    PlanItemRef:
      type: object
      required: [sourceType, sourceId]
      properties:
        sourceType: { $ref: '#/components/schemas/PlanSourceType' }
        sourceId: { type: integer, format: int64 }
    PlanCreate:
      type: object
      required: [title, items, estimatedDurationMinutes, startDateTime, endDateTime, priorityOrder]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        items:
          type: array
          minItems: 1
          description: Existing, distinct tasks/habits/learning cards (BR-10)
          items: { $ref: '#/components/schemas/PlanItemRef' }
        estimatedDurationMinutes: { type: integer, minimum: 1, maximum: 100000 }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time, description: Must be after startDateTime (BR-11) }
        priorityOrder: { type: integer, minimum: 1, description: 1 is the highest }
    PlanUpdate:
      type: object
      required: [title, estimatedDurationMinutes, startDateTime, endDateTime, priorityOrder]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        estimatedDurationMinutes: { type: integer, minimum: 1, maximum: 100000 }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        priorityOrder: { type: integer, minimum: 1 }
    PlanItemUpdate:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
    PlanItem:
      type: object
      required: [id, sourceType, sourceId, sourceTitle, sourceRemoved, done]
      properties:
        id: { type: integer, format: int64 }
        sourceType: { $ref: '#/components/schemas/PlanSourceType' }
        sourceId: { type: integer, format: int64 }
        sourceTitle: { type: string }
        sourceRemoved: { type: boolean, description: The source was deleted (FR-07.6) }
        done: { type: boolean }
    Plan:
      type: object
      required: [id, title, items, estimatedDurationMinutes, startDateTime, endDateTime, priorityOrder,
                 status, createdAt, doneItems, totalItems, progressPercent]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/PlanItem' } }
        estimatedDurationMinutes: { type: integer }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        priorityOrder: { type: integer }
        status: { $ref: '#/components/schemas/PlanStatus', description: Computed on read (FR-08.4, Q2) }
        createdAt: { type: string, format: date-time }
        doneItems: { type: integer }
        totalItems: { type: integer }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        restSeconds:
          type: [integer, 'null']
          format: int64
          description: Seconds until endDateTime while start <= now < end, otherwise null (BR-12)

    TaskCounts:
      type: object
      required: [total, done]
      properties:
        total: { type: integer, description: Non-archived tasks }
        done: { type: integer }
    HabitCounts:
      type: object
      required: [active, completedToday]
      properties:
        active: { type: integer }
        completedToday: { type: integer }
    PlanCounts:
      type: object
      required: [notStarted, inProgress, completed]
      properties:
        notStarted: { type: integer }
        inProgress: { type: integer }
        completed: { type: integer }
    LearningSnapshot:
      type: object
      required: [notStarted, inProgress, completed, milestonesDone, milestonesTotal]
      properties:
        notStarted: { type: integer }
        inProgress: { type: integer }
        completed: { type: integer }
        milestonesDone: { type: integer }
        milestonesTotal: { type: integer }
    Dashboard:
      type: object
      required: [now, dueToday, overdue, completedToday, taskCompletionPercent, taskCounts, habits,
                 habitCounts, activePlans, planCounts, learning]
      properties:
        now: { type: string, format: date-time }
        dueToday: { type: array, items: { $ref: '#/components/schemas/Task' } }
        overdue: { type: array, items: { $ref: '#/components/schemas/Task' } }
        completedToday: { type: array, items: { $ref: '#/components/schemas/Task' } }
        taskCompletionPercent: { type: integer, minimum: 0, maximum: 100 }
        taskCounts: { $ref: '#/components/schemas/TaskCounts' }
        habits: { type: array, description: Active habits, items: { $ref: '#/components/schemas/Habit' } }
        habitCounts: { $ref: '#/components/schemas/HabitCounts' }
        activePlans: { type: array, description: IN_PROGRESS plans by priority, items: { $ref: '#/components/schemas/Plan' } }
        planCounts: { $ref: '#/components/schemas/PlanCounts' }
        learning: { $ref: '#/components/schemas/LearningSnapshot' }

    DefaultPage: { type: string, enum: [DASHBOARD, TASKS, HABITS, LEARNING, PLANS, SETTINGS] }
    Settings:
      type: object
      description: Profile and preferences of the single user (FR-10.2, Q3)
      required: [planStartNotifications, defaultPage]
      properties:
        displayName: { type: [string, 'null'], maxLength: 100 }
        planStartNotifications: { type: boolean, default: true }
        defaultPage: { $ref: '#/components/schemas/DefaultPage' }
