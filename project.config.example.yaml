# project.config.example.yaml: the template for project.config.yaml.
#
# project.config.yaml is the ONLY per-project file. The skills, Loop-instructions and scripts
# stay the same for every project; everything stack- or project-specific lives here.
# You write it once (Claude may help interactively). No loop session can change it: it is a
# protected path, and the runner refuses to start without it.
#
# Commands run from the repo root. `test`, `run_test`, `scaffold` are run by the RUNNER only;
# `build`, `generate_client` and anything under allow_commands are what dev sessions may run.

project:
  name: MyApp

# Optional nicer feature slugs per requirements file (default: file name, lower-cased).
features:
  PRD.md: myapp

app:
  timezone: Europe/London          # IANA zone: server-side "today"/"overdue" and the UI's display zone

claude:
  model: claude-opus-5-5           # passed as --model to every session, recorded in docs/sessions.csv
  max_turns: 200                   # --max-turns per session
  timeout: 45m                     # `timeout` around each claude -p call
  max_run_cost_usd: 100            # spending cap per run_id (orchestrate.sh passes one run_id down)
  extra_args: []                   # e.g. ["--mcp-config", ".mcp.json"] if dry-run check #10 needs it

unit_timeout: 20m                  # `timeout` around the runner's unit-test run
server_timeout: 180                # seconds to wait for each ready_url

orchestrator:
  max_fix_rounds: 3                # suite -> dev fix -> suite rounds before giving up

# Pinned stack: the constitution copies this table; nothing may use other versions.
stack:
  backend: {language: "<lang + version>", framework: "<framework + version>"}
  frontend: {framework: "<framework + version>"}

testing:
  # files Playwright MCP writes into the attempt folder that are zipped as evidence when a
  # check failed (trace.zip) and deleted otherwise. Screenshots are always kept.
  trace_globs: []

guard:
  extra_plan_paths: []             # extra paths plan sessions may write (dry-run check #3)

layers:
  backend:
    loop: backend-dev
    dir: backend
    scaffold: "<command that creates ./backend, run once by the runner>"
    build: "<build command>"
    test: "<unit test command; must always write its reports, even when tests fail>"
    run: "<command to run the app for you>"
    run_test: "<command to run the app on the throwaway test database>"
    base_url: http://localhost:8080
    health: /health
    ready_url: http://localhost:8080/health
    test_db_glob: "backend/data/test*"     # deleted before every test session
    openapi_output: backend/target/openapi.json
    openapi_copy: loops/backend-dev/outputs/openapi.json
    app_wide_files: [loops/backend-dev/outputs/openapi.json]
    reports:
      junit_glob: "backend/target/test-reports/*.xml"
      coverage_xml: backend/target/coverage.xml       # JaCoCo XML format
      coverage_html: backend/target/coverage-html
    coverage:
      package: com/example/domain      # JaCoCo package name (slashes)
      min_line: 0.80
    compile_error_patterns: ["COMPILATION ERROR"]
    harness_error_patterns: ["Could not resolve dependencies"]
    allow_commands: ["cd", "<build tool>"]           # become Bash(<cmd>:*) for dev sessions
    test_commands: []                                # extra commands testing sessions may run
  frontend:
    loop: frontend-dev
    dir: frontend
    needs: [backend]                   # layers that must be running when this one is tested
    contract_from: backend             # its swagger input comes from this layer
    scaffold: "<command that creates ./frontend>"
    build: "<build command>"
    test: ""                           # optional; empty = no frontend unit tests
    run: "<dev server command>"
    run_test: "<dev server command>"
    url: http://localhost:4200
    ready_url: http://localhost:4200
    generate_client: "<client generator command reading loops/backend-dev/outputs/openapi.json>"
    ui_url_file: loops/frontend-dev/outputs/ui-url.md
    app_wide_files: [loops/frontend-dev/outputs/ui-url.md]
    compile_error_patterns: ["error TS"]
    harness_error_patterns: ["npm ERR! network"]
    allow_commands: ["cd", "npm", "npx"]
    test_commands: []
